<html lang="en">

    <div id="main">
       <div id="hero">
          <h1>Metric/Imperial Unit Conversion</h1>
          <input type="text" id="num">
          <button id="btn">convert</button>
       </div>
       <div id="other">


       <div class="div">
        <h2>Length(Meter/Feet)</h2>
       <div>
       <p id="meternum"></p> <p id="feet"></p>
        <p id="feetnum"></p> <p id="meter"></p>
       </div>
       </div>

        <div class="div">
            <h2>Volume(Litres/Gallons)</h2>
         <div>
       <p id="litrenum"></p> <p id="gallons"></p>
        <p id="gallonnum"></p> <p id="litre"></p>
       </div>
        </div>

        <div class="div">
            <h2>Mass(Kilograms/Pounds)</h2>
         <div>
        <p id="kilonum"></p> <p id="pounds"></p>
        <p id="poundsnum"></p> <p id="kilo"></p>
       </div>

        </div>


       </div>
    </div>
    <script src="index.js"></script>
